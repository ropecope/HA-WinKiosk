name: HMI_Panel Windows CI

on:
  push:
    branches: [growbox, "growbox-integration/**"]
  pull_request:
    branches: [growbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and build
        shell: pwsh
        run: dotnet build HA-WinKiosk.sln -c Release
      - name: Regression smoke tests
        shell: pwsh
        run: dotnet run --project tests/GrowBox.Smoke/GrowBox.Smoke.csproj -c Release
      - name: Publish x64
        shell: pwsh
        run: dotnet publish src/HAWinKiosk/HAWinKiosk.csproj -c Release -r win-x64 --self-contained true /p:BundleAsExe=true /p:PublishSingleFile=false -o publish
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/HAWinKiosk.exe)) { throw "Missing published executable" }
      - name: Camera settings UI regression
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/HAWinKiosk.exe).Path -ArgumentList '--check-camera-ui' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Camera UI test timed out" }
          if ($p.ExitCode -ne 0) {
            $log = Join-Path $env:TEMP "growbox-camera-ui-test.log"
            if (Test-Path $log) { Get-Content $log }
            throw "Camera UI test failed: $($p.ExitCode)"
          }
      - name: Name the portable executable
        shell: pwsh
        run: Rename-Item publish/HAWinKiosk.exe HMI_Panel.exe
      - uses: actions/upload-artifact@v4
        with:
          name: HMI_Panel-x64-portable
          path: publish/
          retention-days: 7
      - name: Publish portable single EXE
        shell: pwsh
        run: |
          dotnet publish src/HAWinKiosk/HAWinKiosk.csproj -c Release -r win-x64 --self-contained true /p:BundleAsExe=true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=false /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=false /p:PublishTrimmed=false /p:DebugType=none -o portable
          if ($LASTEXITCODE -ne 0) { throw "Portable publish failed" }
          if (-not (Test-Path portable/HAWinKiosk.exe)) { throw "Portable EXE missing" }
          New-Item -ItemType Directory -Force portable-check | Out-Null
          Copy-Item portable/HAWinKiosk.exe portable-check/HMI_Panel.exe
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP "growbox-portable-test"
          $p = Start-Process -FilePath (Resolve-Path portable-check/GrowBox-Panel.exe).Path -ArgumentList '--check-portable' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Portable smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Portable smoke test failed: $($p.ExitCode)" }
          Remove-Item Env:DOTNET_BUNDLE_EXTRACT_BASE_DIR
      - uses: actions/upload-artifact@v4
        with:
          name: HMI_Panel-exe
          path: portable-check/GrowBox-Panel.exe
          retention-days: 7
