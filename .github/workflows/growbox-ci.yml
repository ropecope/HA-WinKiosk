name: GrowBox Panel Windows CI

on:
  push:
    branches: [growbox, "growbox-integration/**"]
  pull_request:
    branches: [growbox]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore and build
        shell: pwsh
        run: dotnet build HA-WinKiosk.sln -c Release
      - name: Regression smoke tests
        shell: pwsh
        run: dotnet run --project tests/GrowBox.Smoke/GrowBox.Smoke.csproj -c Release
      - name: Publish x64
        shell: pwsh
        run: dotnet publish src/HAWinKiosk/HAWinKiosk.csproj -c Release -r win-x64 --self-contained true /p:BundleAsExe=true /p:PublishSingleFile=false -o publish
      - name: Include verified WebView2 bootstrapper
        shell: pwsh
        run: ./tools/Add-WebView2Bootstrapper.ps1 -PublishDir publish
      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path publish/HAWinKiosk.exe)) { throw "Missing published executable" }
      - uses: actions/upload-artifact@v4
        with:
          name: GrowBox-Panel-x64-preview
          path: publish/
          retention-days: 7
      - name: Publish portable single EXE
        shell: pwsh
        run: |
          $bootstrapper = (Resolve-Path publish/MicrosoftEdgeWebview2Setup.exe).Path
          dotnet publish src/HAWinKiosk/HAWinKiosk.csproj -c Release -r win-x64 --self-contained true /p:BundleAsExe=true /p:PublishSingleFile=true /p:IncludeAllContentForSelfExtract=true /p:IncludeNativeLibrariesForSelfExtract=true /p:PublishTrimmed=false /p:DebugType=none "/p:PortableBootstrapper=$bootstrapper" -o portable
          if ($LASTEXITCODE -ne 0) { throw "Portable publish failed" }
          if (-not (Test-Path portable/HAWinKiosk.exe)) { throw "Portable EXE missing" }
          New-Item -ItemType Directory -Force portable-check | Out-Null
          Copy-Item portable/HAWinKiosk.exe portable-check/GrowBox-Panel.exe
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP "growbox-portable-test"
          $p = Start-Process -FilePath (Resolve-Path portable-check/GrowBox-Panel.exe).Path -ArgumentList '--check-portable' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "Portable smoke test timed out" }
          if ($p.ExitCode -ne 0) { throw "Portable smoke test failed: $($p.ExitCode)" }
          Remove-Item Env:DOTNET_BUNDLE_EXTRACT_BASE_DIR
      - uses: actions/upload-artifact@v4
        with:
          name: GrowBox-Panel-portable-exe
          path: portable-check/GrowBox-Panel.exe
          retention-days: 7
      - name: Build preview installer
        shell: pwsh
        run: |
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC unavailable" }
          $publishDir = (Resolve-Path publish).Path
          & $iscc "/DPublishDir=$publishDir" installer/HAWinKiosk.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          if (-not (Test-Path installer/output/HAWinKiosk-Setup.exe)) { throw "Installer missing" }
          Copy-Item installer/output/HAWinKiosk-Setup.exe GrowBox-Panel-Preview-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: GrowBox-Panel-preview-installer
          path: GrowBox-Panel-Preview-Setup.exe
          retention-days: 7
